version: '3.8'

services:
  mysql:
    image: mysql:8.0.42
    container_name: private-mysql
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_general_ci",
      "--default-time-zone=+09:00"
    ]
    env_file:
      - .env.private
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=Asia/Seoul
    volumes:
      - private-db-data:/var/lib/mysql
      # 필요 시 설정/초기화 스크립트 활성화
      # - ./mysql/conf.d:/etc/mysql/conf.d
      # - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "3306:3306"

  standardizer:
    build:
      context: ./backend/private-server/standardizer-server
      dockerfile: Dockerfile
    image: s13p21a402/standardizer-server:latest
    container_name: standardizer-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
      - ENABLE_CRAWLER_SCHEDULER=${ENABLE_CRAWLER_SCHEDULER:-false}
      - DISPLAY=:99
    # 리버스 프록시 뒤에 둘 때는 포트 매핑 비활성화 가능
    ports:
      - "${STANDARDIZER_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    # 크롤러를 위한 추가 권한
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    # (권장) 헬스체크가 있다면 추가
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    volumes:
      - shared-data:/app/data
      - crawler-data:/app/output
      - /dev/shm:/dev/shm  # Chrome 성능 향상을 위한 공유 메모리
    networks:
      - app-net
    restart: unless-stopped

  summary:
    build:
      context: ./backend/private-server/summary-server
      dockerfile: Dockerfile
    image: s13p21a402/summary-server:latest
    container_name: summary-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
    ports:
      - "${SUMMARY_PORT:-8100}:8100"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - shared-data:/app/data
    networks:
      - app-net
    restart: unless-stopped

  news-summary:
    build:
      context: ./backend/private-server/news-summary-server
      dockerfile: Dockerfile
    image: s13p21a402/news-summary-server:latest
    container_name: news-summary-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?charset=utf8mb4
    ports:
      - "${NEWS_SUMMARY_PORT:-8200}:8200"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - shared-data:/app/data
    networks:
      - app-net
    restart: unless-stopped

volumes:
  private-db-data:
  shared-data:
  crawler-data:

networks:
  app-net:
    driver: bridge
