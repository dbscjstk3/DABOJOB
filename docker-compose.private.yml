version: '3.8'

services:
  # Redis 서버 (기존 Redis Streams 통신)
  redis:
    image: redis:7-alpine
    container_name: private-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 중앙 Ollama 서버 (모든 LLM 모델 서빙)
  ollama:
    image: ollama/ollama:latest
    container_name: private-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=3
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=5m
    networks:
      - app-net
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 12G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # 모델 초기화 서비스 (최초 1회)
  model-init:
    image: ollama/ollama:latest
    container_name: model-initializer
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - app-net
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: |
      sh -c "
      echo 'Waiting for Ollama server...'
      sleep 5
      echo 'Pulling models...'
      ollama pull qwen2.5:1.8b-instruct-q4_0 --host ollama:11434
      ollama pull qwen2.5:0.5b-instruct-fp16 --host ollama:11434
      echo 'Model initialization complete!'
      "

  mysql:
    image: mysql:8.0.42
    container_name: private-mysql
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_general_ci",
      "--default-time-zone=+09:00"
    ]
    env_file:
      - .env.private
    volumes:
      - private-db-data:/var/lib/mysql
      # 필요 시 설정/초기화 스크립트 활성화
      # - ./mysql/conf.d:/etc/mysql/conf.d
      # - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - app-net

  standardizer:
    build:
      context: ./backend/private-server/standardizer-server
      dockerfile: Dockerfile
    image: s13p21a402/standardizer-server:latest
    container_name: standardizer-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - OLLAMA_HOST=ollama:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    # (권장) 헬스체크가 있다면 추가
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s
    networks:
      - app-net
    restart: unless-stopped

  summary:
    build:
      context: ./backend/private-server/summary-server
      dockerfile: Dockerfile
    image: s13p21a402/summary-server:latest
    container_name: summary-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - OLLAMA_HOST=ollama:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8100:8100"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped

  news-summary:
    build:
      context: ./backend/private-server/news-summary-server
      dockerfile: Dockerfile
    image: s13p21a402/news-summary-server:latest
    container_name: news-summary-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - OLLAMA_HOST=ollama:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8200:8200"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    networks:
      - app-net
    restart: unless-stopped

volumes:
  private-db-data:
  redis-data:
  ollama-models:

networks:
  app-net:
    driver: bridge
