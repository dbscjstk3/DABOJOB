services:
  mysql:
    image: mysql:8.0.42
    container_name: spring-mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_general_ci"
      - "--default-time-zone=+09:00"
    env_file:
      - .env.spring
    environment:
      TZ: Asia/Seoul
    volumes:
      - spring-db-data:/var/lib/mysql
    healthcheck:
      # 컨테이너 내부에서 변수 확장되도록 CMD-SHELL 사용
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-net

  redis:
    image: redis:7-alpine          # redis-cli 포함 이미지 (헬스체크 안정)
    container_name: spring-redis
    env_file:
      - .env.spring
    # 컨테이너 내부 쉘에서 환경변수 확장되도록 sh -lc 사용
    command: >
      sh -lc 'exec redis-server
        --requirepass "$REDIS_PASSWORD"
        --appendonly yes
        --appendfsync everysec
        --save ""
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-net

  mongo:
    image: mongo:7.0.14
    container_name: spring-mongo
    env_file:
      - .env.spring
    environment:
      # 공식 엔트리포인트가 요구하는 변수명으로 전달
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo-data:/data/db
      # 필요 시 앱 전용 계정 생성용 init 스크립트 마운트
      # - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username root --password \"$MONGO_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-net

  app:
    build:
      context: ./backend/spring-server
      dockerfile: Dockerfile
    image: s13p21a402/spring-server:latest
    container_name: spring-server
    env_file:
      - .env.spring
    environment:
      TZ: Asia/Seoul
      JAVA_OPTS: ${JAVA_OPTS}
      # (선택) 고정값을 compose에서 강제하고 싶다면 아래 주석 해제
      # SPRING_REDIS_HOST: redis
      # SPRING_REDIS_PORT: 6379
    ports:
      - "80:8080"   # 외부 80 → 컨테이너 8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

volumes:
  spring-db-data:
  redis-data:
  mongo-data:

networks:
  app-net:
    driver: bridge
