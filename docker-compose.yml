services:
  app:
    build:
      context: ./backend/spring-server
      dockerfile: Dockerfile
    image: s13p21a402/spring-server:latest
    container_name: spring-server
    env_file:
      - .env
    environment:
      # 기본값은 application.yml의 ${...:default} 로 대체됨
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_JPA_SHOW_SQL=${SPRING_JPA_SHOW_SQL}
      - SPRING_JPA_FORMAT_SQL=${SPRING_JPA_FORMAT_SQL}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - JAVA_OPTS=${JAVA_OPTS}
      - TZ=Asia/Seoul
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      - MYSQL_DATABASE=app
      - MYSQL_USER=app
      - MYSQL_PASSWORD=app
      - MYSQL_ROOT_PASSWORD=password
      - TZ=Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    networks:
      - app-net

  standardizer:
    build:
      context: ./backend/private-server/standardizer-server
      dockerfile: Dockerfile
    image: s13p21a402/standardizer-server:latest
    container_name: standardizer-server
    environment:
      - TZ=Asia/Seoul
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - app-net

  summary:
    build:
      context: ./backend/private-server/summary-server
      dockerfile: Dockerfile
    image: s13p21a402/summary-server:latest
    container_name: summary-server
    environment:
      - TZ=Asia/Seoul
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    ports:
      - "8100:8100"
    depends_on:
      - redis
    networks:
      - app-net

  news-summary:
    build:
      context: ./backend/private-server/news-summary-server
      dockerfile: Dockerfile
    image: s13p21a402/news-summary-server:latest
    container_name: news-summary-server
    environment:
      - TZ=Asia/Seoul
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    ports:
      - "8200:8200"
    depends_on:
      - redis
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  db-data:
  redis-data:

networks:
  app-net:
    driver: bridge


