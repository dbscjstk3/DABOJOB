services:
  mysql:                        # <- db 대신 mysql 로 통일
    image: mysql:8.0
    container_name: mysql
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_general_ci",
      "--default-time-zone=Asia/Seoul"
    ]
    environment:
      - MYSQL_DATABASE=app
      - MYSQL_USER=app
      - MYSQL_PASSWORD=app
      - MYSQL_ROOT_PASSWORD=password
      - TZ=Asia/Seoul
    volumes:
      - db-data:/var/lib/mysql
    # 외부 포트 공개 제거 (보안상 권장) -> ports 섹션 삭제
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - app-net

  app:
    build:
      context: ./backend/spring-server
      dockerfile: Dockerfile
    image: s13p21a402/spring-server:latest
    container_name: spring-server
    env_file:
      - .env.spring
    environment:
      - TZ=Asia/Seoul
      - JAVA_OPTS=${JAVA_OPTS}
    # 외부 포트 고정 또는 EXTERNAL_HTTP_PORT 사용
    ports:
      - "80:8080"                       # 또는 "${EXTERNAL_HTTP_PORT:-80}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

  standardizer:
    build:
      context: ./backend/private-server/standardizer-server
      dockerfile: Dockerfile
    image: s13p21a402/standardizer-server:latest
    container_name: standardizer-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
    ports:
      - "${STANDARDIZER_PORT:-8000}:8000"
    networks:
      - app-net
    restart: unless-stopped

  summary:
    build:
      context: ./backend/private-server/summary-server
      dockerfile: Dockerfile
    image: s13p21a402/summary-server:latest
    container_name: summary-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
    ports:
      - "${SUMMARY_PORT:-8100}:8100"
    networks:
      - app-net
    restart: unless-stopped

  news-summary:
    build:
      context: ./backend/private-server/news-summary-server
      dockerfile: Dockerfile
    image: s13p21a402/news-summary-server:latest
    container_name: news-summary-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
    ports:
      - "${NEWS_SUMMARY_PORT:-8200}:8200"
    networks:
      - app-net
    restart: unless-stopped

volumes:
  db-data:

networks:
  app-net:
    driver: bridge
