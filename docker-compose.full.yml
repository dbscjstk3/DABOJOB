services:
  mysql:
    image: mysql:8.0.42
    container_name: private-mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_general_ci"
      - "--default-time-zone=+09:00"
    env_file:
      - .env.private
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=Asia/Seoul
    volumes:
      - private-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks:
      - app-net

  ollama:
    image: ollama/ollama:latest
    container_name: private-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434   # 바인드 주소 (접속용 URL은 각 앱의 OLLAMA_BASE_URL 사용)
      - /home/ubuntu/ollama_model:/models:ro
    healthcheck:
      # curl 없이 ollama CLI로 확인
      test: ["CMD", "sh", "-lc", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-net
    # GPU 사용 시 추가 (선택)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: private-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-net

  standardizer:
    build:
      context: ./backend/private-server/standardizer-server
      dockerfile: Dockerfile
    image: s13p21a402/standardizer-server:latest
    container_name: standardizer-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "${STANDARDIZER_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      # curl 대신 파이썬 원라이너로 HTTP 확인
      test:
        [
          "CMD",
          "sh",
          "-lc",
          "python - <<'PY'\nimport urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); print('OK')\nPY"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - shared-data:/app/data
    networks:
      - app-net
    restart: unless-stopped

  summary:
    build:
      context: ./backend/private-server/summary-server
      dockerfile: Dockerfile
    image: s13p21a402/summary-server:latest
    container_name: summary-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "${SUMMARY_PORT:-8100}:8100"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-lc",
          "python - <<'PY'\nimport urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3); print('OK')\nPY"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - shared-data:/app/data
    networks:
      - app-net
    restart: unless-stopped

  news-summary:
    build:
      context: ./backend/private-server/news-summary-server
      dockerfile: Dockerfile
    image: s13p21a402/news-summary-server:latest
    container_name: news-summary-server
    env_file:
      - .env.private
    environment:
      - TZ=Asia/Seoul
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "${NEWS_SUMMARY_PORT:-8200}:8200"
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-lc",
          "python - <<'PY'\nimport urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3); print('OK')\nPY"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-net
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: private-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ACME_AGREE=true
      - EMAIL=admin@example.com     # 인증서 연락 이메일 (원하는 주소로 변경)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data            # 인증서/키 저장
      - caddy-config:/config
    networks:
      - app-net                     # 내부 서비스와 같은 네트워크여야 함

volumes:
  private-db-data:
  ollama-data:
  redis-data:
  shared-data:
  caddy-data:
  caddy-config:

networks:
  app-net:
    driver: bridge
