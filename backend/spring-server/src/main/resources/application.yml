spring:
  application:
    name: demo
  config:
    import:
      - classpath:search-config.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      idle-timeout: ${SPRING_DATASOURCE_IDLE_TIMEOUT:300000}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:3}
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:5}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT:600000}
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 1s
    socket-timeout: 30s

  data:
    elasticsearch:
      client:
        reactive:
          connection-timeout: 5s
          socket-timeout: 10s
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
          ssafy:
            client-id: ${SSAFY_CLIENT_ID:}
            client-secret: ${SSAFY_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
        provider:
          ssafy:
            authorization-uri: ${SSAFY_AUTHORIZATION_URI:https://project.ssafy.com/oauth/sso-check}
            token-uri: ${SSAFY_TOKEN_URI:https://project.ssafy.com/ssafy/oauth2/token}
            user-info-uri: ${SSAFY_USER_INFO_URI:https://project.ssafy.com/ssafy/resources/userInfo}
            user-name-attribute: ${SSAFY_USER_NAME_ATTRIBUTE:userId}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info        # ← 헬스/인포 노출
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never           # 상세정보 숨김(운영기 기본)

jwt:
  secret-key: ${JWT_SECRET_KEY:}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
  issuer: ${JWT_ISSUER:dabojob-app}

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    stack:
      auto: false
    s3:
      bucket: dabojob-bucket